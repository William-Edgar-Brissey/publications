name: Check release orchestrator

on:
  pull_request:
    paths:
      - release/**
      - scripts/release_orchestrator.py
      - scripts/publish_x.py
      - tests/test_release_orchestrator.py
      - .github/workflows/release-orchestrator*.yml
      - .github/workflows/distribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile scripts/release_orchestrator.py scripts/publish_x.py
      - name: Run unit tests
        run: python -m unittest tests/test_release_orchestrator.py
      - name: Validate current queue
        run: python scripts/release_orchestrator.py release/release-queue.json --now 2026-09-01T12:00:00+08:00
