name: Build publication distribution bundle

on:
  workflow_dispatch:
    inputs:
      source:
        description: Quarto article source
        required: true
        default: articles/realignment-architecture-prospectus.qmd
        type: string
      create_typefully_drafts:
        description: Create private X Article and LinkedIn document drafts
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publication-distribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLICATION_SOURCE: ${{ inputs.source }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Quarto and TinyTeX
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Render publication editions
        run: quarto render "$PUBLICATION_SOURCE"

      - name: Build channel-native bundle
        run: python scripts/build_distribution.py "$PUBLICATION_SOURCE" --site-dir _site --output-dir dist

      - name: Validate private Typefully payloads
        run: python scripts/create_typefully_drafts.py "dist/$(basename "$PUBLICATION_SOURCE" .qmd)"

      - name: Create private Typefully drafts
        if: ${{ inputs.create_typefully_drafts }}
        env:
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
        run: python scripts/create_typefully_drafts.py "dist/$(basename "$PUBLICATION_SOURCE" .qmd)" --submit

      - name: Upload review bundle
        uses: actions/upload-artifact@v4
        with:
          name: publication-distribution-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30
