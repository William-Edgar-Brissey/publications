name: Realignment R1 Release Preflight

on:
  push:
    branches:
      - release/realignment-r1
    paths:
      - .github/workflows/realignment-r1-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install reproduction dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas scipy
      - name: Recompute published RQ5 statistics
        run: python evidence/rq5-r0/recompute_from_matrix.py | tee /tmp/rq5.txt
      - name: Verify primary coefficient and permutation result
        run: |
          grep -q -- "-0.7721316619724065" /tmp/rq5.txt
          grep -q "'shuffle_hits': 0" /tmp/rq5.txt
      - name: Render flagship HTML
        run: quarto render articles/realignment-architecture-prospectus.qmd --to html
      - name: Capture flagship PDF compiler output
        id: flagship_pdf
        shell: bash
        run: |
          set +e
          quarto render articles/realignment-architecture-prospectus.qmd --to pdf > /tmp/flagship-pdf.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/flagship-pdf.log
          find . -maxdepth 4 -name 'realignment-architecture-prospectus.tex' -print -exec cp {} /tmp/flagship.tex \;
          exit 0
      - name: Upload PDF diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: realignment-r1-pdf-diagnostic
          path: |
            /tmp/flagship-pdf.log
            /tmp/flagship.tex
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce flagship PDF success
        run: test "${{ steps.flagship_pdf.outputs.exit_code }}" = "0"
      - name: Render RQ5 evidence note HTML
        run: quarto render articles/rq5-ubay-enso-reproduction.qmd --to html
      - name: Render RQ5 evidence note PDF
        run: quarto render articles/rq5-ubay-enso-reproduction.qmd --to pdf
      - name: Verify rendered artifacts and evidence resources
        run: |
          test -f _site/articles/realignment-architecture-prospectus.html
          test -f _site/articles/realignment-architecture-prospectus.pdf
          test -f _site/articles/rq5-ubay-enso-reproduction.html
          test -f _site/articles/rq5-ubay-enso-reproduction.pdf
          test -f _site/evidence/rq5-r0/SOURCE_FREEZE_R0.json
          test -f _site/evidence/rq5-r0/processed_rq5_matrix.csv
